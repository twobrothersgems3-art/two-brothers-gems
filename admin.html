<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Two Brothers Gems - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0b;
  color:#fff;
}

header{
  background:#111;
  border-bottom:1px solid #b89545;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#d6b15a;
  font-size:21px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.gold{
  background:#d6b15a;
  color:#111;
}

.logout{
  background:#333;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

#loginBox{
  max-width:420px;
  margin:70px auto;
  background:#151515;
  padding:25px;
  border-radius:15px;
  border:1px solid #b89545;
}

h1,h2{
  color:#d6b15a;
}

input,select{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  border-radius:8px;
  border:1px solid #555;
  background:#222;
  color:#fff;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:18px;
}

.stat strong{
  display:block;
  font-size:26px;
  color:#d6b15a;
  margin-top:7px;
}

.order{
  background:#151515;
  border:1px solid #333;
  border-radius:14px;
  margin-bottom:15px;
  padding:18px;
}

.orderTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.orderId{
  color:#d6b15a;
  font-weight:bold;
}

.status{
  font-weight:bold;
  color:#d6b15a;
}

.item{
  border-top:1px solid #333;
  padding:12px 0;
  margin-top:12px;
}

.small{
  color:#aaa;
  font-size:14px;
}

.total{
  font-size:20px;
  color:#d6b15a;
  font-weight:bold;
}

.hidden{
  display:none;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .container{
    padding:12px;
  }

  header{
    padding:14px;
  }

  .logo{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">💎 TWO BROTHERS GEMS</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<!-- LOGIN -->
<div id="loginBox">

  <h1>Admin Login</h1>

  <p class="small">
    Login to manage your orders.
  </p>

  <input
    type="email"
    id="email"
    placeholder="Admin email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button class="gold" style="width:100%" onclick="login()">
    Login
  </button>

  <p id="loginMessage" class="small"></p>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="container hidden">

  <h1>Order Dashboard</h1>

  <div class="stats">

    <div class="stat">
      Total Orders
      <strong id="totalOrders">0</strong>
    </div>

    <div class="stat">
      Pending
      <strong id="pendingOrders">0</strong>
    </div>

    <div class="stat">
      Processing
      <strong id="processingOrders">0</strong>
    </div>

    <div class="stat">
      Delivered
      <strong id="deliveredOrders">0</strong>
    </div>

  </div>

  <button class="gold" onclick="loadOrders()">
    🔄 Refresh Orders
  </button>

  <div id="orders" style="margin-top:20px">
    Loading orders...
  </div>

</div>


<script>

const SUPABASE_URL =
"https://mwtechejxqqgbbwhvncz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_w-NfLeaiz7OOd74A2VQ6jw_aHjsHFQC";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// LOGIN
async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){
    message.textContent =
      "Please enter email and password.";
    return;
  }

  message.textContent = "Logging in...";

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    message.textContent =
      error.message;

    return;
  }

  showDashboard();
}


// SHOW DASHBOARD
async function showDashboard(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  await loadOrders();
}


// LOAD ORDERS
async function loadOrders(){

  const ordersDiv =
    document.getElementById("orders");

  ordersDiv.innerHTML =
    "Loading orders...";

  const {data:orders,error} =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("order_date",{ascending:false});

  if(error){

    ordersDiv.innerHTML =
      "Error loading orders: " +
      error.message;

    return;
  }

  updateStats(orders);

  if(!orders || orders.length === 0){

    ordersDiv.innerHTML =
      "<p>No orders yet.</p>";

    return;
  }

  let html = "";

  for(const order of orders){

    const {data:items,error:itemError} =
      await supabaseClient
        .from("order_items")
        .select("*")
        .eq("order_id",order.order_id);

    if(itemError){
      console.error(itemError);
    }

    html += `

      <div class="order">

        <div class="orderTop">

          <div>
            <div class="orderId">
              ${escapeHtml(order.order_id)}
            </div>

            <div class="small">
              ${new Date(order.order_date).toLocaleString()}
            </div>
          </div>

          <div class="status">
            ${escapeHtml(order.status)}
          </div>

        </div>


        <hr style="border-color:#333">


        <p>
          👤 <b>${escapeHtml(order.customer_name)}</b>
        </p>

        <p>
          📞 ${escapeHtml(order.phone)}
        </p>

        <p>
          📍 ${escapeHtml(order.address)}
          <br>
          Pincode: ${escapeHtml(order.pincode)}
        </p>


        ${
          items && items.length
          ?
          items.map(item => `

            <div class="item">

              <b>${escapeHtml(item.product)}</b>

              <div class="small">
                Shape: ${escapeHtml(item.shape)}
              </div>

              <div class="small">
                Carat: ${escapeHtml(item.quantity)} ct
              </div>

              <div class="small">
                Price: ₹${Number(item.price).toLocaleString()}
                / ${escapeHtml(item.unit)}
              </div>

              <div>
                Item Total:
                ₹${Number(item.total_amount).toLocaleString()}
              </div>

            </div>

          `).join("")
          :
          `
          <div class="item">
            ${escapeHtml(order.product)}
            — ${escapeHtml(order.quantity)}
            ${escapeHtml(order.unit)}
          </div>
          `
        }


        <p class="total">
          Total: ₹${Number(order.total_amount).toLocaleString()}
        </p>


        <label class="small">
          Order Status
        </label>

        <select
          onchange="changeStatus(
            '${escapeHtml(order.order_id)}',
            this.value
          )"
        >

          ${statusOption("Pending",order.status)}
          ${statusOption("Confirmed",order.status)}
          ${statusOption("Processing",order.status)}
          ${statusOption("Shipped",order.status)}
          ${statusOption("Delivered",order.status)}
          ${statusOption("Cancelled",order.status)}

        </select>

      </div>
    `;
  }

  ordersDiv.innerHTML = html;
}


// STATUS OPTION
function statusOption(value,current){

  return `
    <option
      value="${value}"
      ${value === current ? "selected" : ""}
    >
      ${value}
    </option>
  `;
}


// CHANGE STATUS
async function changeStatus(orderId,status){

  const {error} =
    await supabaseClient
      .from("orders")
      .update({status:status})
      .eq("order_id",orderId);

  if(error){

    alert(
      "Could not update status:\n" +
      error.message
    );

    return;
  }

  alert("Order status updated.");

  loadOrders();
}


// STATISTICS
function updateStats(orders){

  document.getElementById("totalOrders")
    .textContent = orders.length;

  document.getElementById("pendingOrders")
    .textContent =
      orders.filter(o => o.status === "Pending").length;

  document.getElementById("processingOrders")
    .textContent =
      orders.filter(o => o.status === "Processing").length;

  document.getElementById("deliveredOrders")
    .textContent =
      orders.filter(o => o.status === "Delivered").length;
}


// LOGOUT
async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();
}


// SECURITY: HTML ESCAPE
function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// CHECK EXISTING LOGIN
supabaseClient.auth.getSession()
.then(({data}) => {

  if(data.session){
    showDashboard();
  }

});

</script>

</body>
</html>
